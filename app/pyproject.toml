[project]
name = "app"
version = "0.1.0"
description = ""
authors = [
    {name = "Anderson", email = "andersonalencarbarros@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi[standard] (>=0.162.2,<0.163.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "psycopg[binary] (>=3.3.8,<4.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "litellm (>=1.108.4,<2.0.0)",
    "celery[redis] (>=5.7.0,<6.0.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
httpx = "^0.28.1"
pytest-asyncio = "^1.4.1"
testcontainers = "^4.15.0"
ruff = "^0.17.4"

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.poetry]
exclude = ["src/infraestrutura/alembic"]
packages = [
    {include = "main.py", from = "src"},
    {include = "config.py", from = "src"},
    {include = "api", from = "src"},
    {include = "dominio", from = "src"},
    {include = "infraestrutura", from = "src"},
    {include = "repositorio", from = "src"},
    {include = "servicos", from = "src"}
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
